<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E5E8EB;font-family:Pretendard,Inter,'Noto Sans KR',sans-serif;color:#191F28;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
*{box-sizing:border-box}
a{color:#3182F6;text-decoration:none}a:hover{color:#1B64DA}
button,select{font-family:inherit}
</style>
</helmet>
<div style="padding:80px;display:inline-block">
<div style="font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#6B7684;margin-bottom:16px">ADMIN · STICKER ISSUANCE · 1440</div>
<div data-screen-label="스티커 발급" style="border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06)">
<dc-import name="PUF Admin Shell" active="stickers" title="스티커 발급" subtitle="제품을 선택하고 패턴 이미지를 업로드하면 스티커가 등록돼요." hint-size="1440px,900px">
  <div style="display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06)">
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:999px;background:#3182F6;color:#fff;font-family:Inter,sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">1</span><span style="font-size:16px;font-weight:700">제품 선택</span></div>
        <select style="margin-top:16px;width:100%;height:52px;padding:0 14px;border-radius:12px;border:1.5px solid transparent;background:#F2F4F6;font-size:15px;color:#191F28;outline:none"><option>글로우 리페어 세럼 50ml</option><option>하이드라 선크림 SPF50+</option><option>에어핏 무선 이어버드</option></select>
        <div style="margin-top:12px;font-size:13px;color:#8B95A1">현재 발급 <span style="font-family:Inter,sans-serif;font-weight:600;color:#4E5968">12,000</span>개 · 루미에르 코스메틱</div>
      </div>
      <div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06)">
        <div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:999px;background:#3182F6;color:#fff;font-family:Inter,sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">2</span><span style="font-size:16px;font-weight:700">패턴 이미지 업로드</span></div>
        <div style="margin-top:16px;padding:32px 24px;border-radius:16px;border:1.5px dashed #B8C0CB;background:#F9FAFB;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;color:#6B7684;cursor:pointer;transition:border-color .3s,background .3s" style-hover="border-color:#3182F6;background:#E8F3FF">
          <span style="width:48px;height:48px;border-radius:14px;background:#E8F3FF;color:#3182F6;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3M12 16V4M7 9l5-5 5 5"></path></svg></span>
          <span style="font-size:15px;font-weight:700;color:#191F28">파일을 끌어다 놓거나 클릭</span>
          <span style="font-size:13px">PNG · TIFF, 최대 500장 / 회</span>
        </div>
        <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;font-size:14px"><span style="color:#4E5968">업로드 중 · <span style="font-family:Inter,sans-serif;font-weight:600;color:#191F28">312 / 500</span></span><span style="font-family:Inter,sans-serif;font-weight:600;color:#3182F6">62%</span></div>
          <div style="height:8px;border-radius:999px;background:#F2F4F6;overflow:hidden"><div style="width:62%;height:100%;border-radius:999px;background:#3182F6;transition:width .3s"></div></div>
        </div>
        <button style="margin-top:20px;width:100%;height:56px;border:0;border-radius:16px;background:#3182F6;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:background .3s" style-hover="background:#1B64DA">스티커 발급하기</button>
      </div>
    </div>
    <div style="background:#fff;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:24px 24px 16px"><div style="font-size:18px;font-weight:700">발급 결과</div><div style="display:flex;gap:16px;font-size:13px;color:#6B7684"><span><span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:#14B866;margin-right:6px"></span>등록 완료 <span style="font-family:Inter,sans-serif;font-weight:600;color:#191F28">308</span></span><span><span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:#F04452;margin-right:6px"></span>실패 <span style="font-family:Inter,sans-serif;font-weight:600;color:#191F28">4</span></span></div></div>
      <div style="display:grid;grid-template-columns:200px 1fr 140px 120px;padding:0 24px 12px;font-size:13px;font-weight:600;color:#8B95A1;border-bottom:1px solid #F2F4F6"><span>스티커 ID</span><span>제품</span><span>발급일</span><span style="text-align:right">상태</span></div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
        <div style="display:grid;grid-template-columns:200px 1fr 140px 120px;align-items:center;padding:14px 24px;font-size:15px;border-bottom:1px solid #F2F4F6;transition:background .3s" style-hover="background:#F9FAFB">
          <span style="font-family:Inter,sans-serif;font-weight:600;font-size:14px">{{ r.id }}</span>
          <span style="color:#4E5968">글로우 리페어 세럼 50ml</span>
          <span style="font-family:Inter,sans-serif;color:#6B7684;font-size:14px">2026.09.07</span>
          <span style="text-align:right"><span style="font-size:12px;font-weight:700;color:{{ r.color }};background:{{ r.bg }};padding:5px 10px;border-radius:999px">{{ r.status }}</span></span>
        </div>
      </sc-for>
    </div>
  </div>
</dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const ids = ['PUF-LM24-000312', 'PUF-LM24-000311', 'PUF-LM24-000310', 'PUF-LM24-000309', 'PUF-LM24-000308', 'PUF-LM24-000307', 'PUF-LM24-000306', 'PUF-LM24-000305'];
    return { rows: ids.map((id, i) => i === 2 ? { id, status: '패턴 인식 실패', color: '#F04452', bg: '#FEECEE' } : i === 0 ? { id, status: '처리 중', color: '#3182F6', bg: '#E8F3FF' } : { id, status: '등록 완료', color: '#14B866', bg: '#E6F8EF' }) };
  }
}
</script>
</body>
</html>
