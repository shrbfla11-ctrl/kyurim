<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:1440px;min-height:900px;background:#F2F4F6;display:grid;grid-template-columns:240px 1fr;font-family:Pretendard,Inter,'Noto Sans KR',sans-serif;color:#191F28">
  <aside style="background:#fff;border-right:1px solid #E5E8EB;padding:24px 16px;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;align-items:center;gap:10px;padding:0 8px"><img src="assets/puf-logo.png" alt="PUF" style="height:24px;width:auto;display:block"><span style="font-size:11px;font-weight:700;color:#3182F6;background:#E8F3FF;padding:3px 8px;border-radius:999px;font-family:Inter,sans-serif">ADMIN</span></div>
    <nav style="display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
        <a href="#" style="display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-size:15px;font-weight:600;color:{{ n.color }};background:{{ n.bg }};transition:background .3s" style-hover="background:#F2F4F6">
          <span style="width:20px;height:20px;display:flex;color:inherit">{{ n.icon }}</span>{{ n.label }}
        </a>
      </sc-for>
    </nav>
    <div style="margin-top:auto;padding:12px;border-radius:14px;background:#F2F4F6;display:flex;align-items:center;gap:10px">
      <span style="width:36px;height:36px;border-radius:999px;background:#E8F3FF;color:#3182F6;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center">민</span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:700">김민지</span><span style="display:block;font-size:12px;color:#8B95A1">루미에르 코스메틱</span></span>
      <a href="#" aria-label="사용자 화면으로" style="color:#8B95A1;display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"></path></svg></a>
    </div>
  </aside>
  <main style="padding:32px 48px 64px;min-width:0">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:32px">
      <div><h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-0.03em">{{ title }}</h1><p style="margin:6px 0 0;font-size:15px;color:#6B7684">{{ subtitle }}</p></div>
      <sc-if value="{{ hasAction }}" hint-placeholder-val="{{ false }}"><button onClick="{{ onAction }}" style="height:44px;padding:0 20px;border:0;border-radius:14px;background:#3182F6;color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .3s;font-family:inherit" style-hover="background:#1B64DA"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{ action }}</button></sc-if>
    </div>
    {{ children }}
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dashboard&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;products&quot;,&quot;stickers&quot;,&quot;monitor&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
class Component extends DCLogic {
  icons = {
    dashboard: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('rect', { x: 3, y: 3, width: 8, height: 8, rx: 2 }), React.createElement('rect', { x: 13, y: 3, width: 8, height: 8, rx: 2 }), React.createElement('rect', { x: 3, y: 13, width: 8, height: 8, rx: 2 }), React.createElement('rect', { x: 13, y: 13, width: 8, height: 8, rx: 2 })),
    products: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { d: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8' })),
    stickers: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { d: 'M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3' }), React.createElement('rect', { x: 9, y: 9, width: 6, height: 6, rx: 1.5 })),
    monitor: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { d: 'M3 12h4l3-7 4 14 3-7h4' }))
  };
  renderVals() {
    const a = this.props.active ?? 'dashboard';
    const items = [['dashboard', '대시보드'], ['products', '제품 관리'], ['stickers', '스티커 발급'], ['monitor', '스캔 모니터링']];
    return {
      nav: items.map(([k, label]) => ({ label, icon: this.icons[k], color: a === k ? '#3182F6' : '#4E5968', bg: a === k ? '#E8F3FF' : 'transparent' })),
      title: this.props.title ?? '', subtitle: this.props.subtitle ?? '', children: this.props.children ?? null, action: this.props.action ?? '', hasAction: !!this.props.action, onAction: this.props.onAction ?? (() => {})
    };
  }
}
</script>
</body>
</html>
