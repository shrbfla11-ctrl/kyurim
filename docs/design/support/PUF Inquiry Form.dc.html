<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:Pretendard,Inter,'Noto Sans KR',sans-serif;color:#191F28">
  <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:24px">
      <div><h1 style="margin:0;font-size:{{ h1Size }};font-weight:700;letter-spacing:-0.03em;line-height:1.3">1:1 문의</h1><p style="margin:8px 0 0;font-size:15px;line-height:1.6;color:#6B7684">영업일 기준 1일 이내에 이메일로 답변드려요.</p></div>
      <div style="background:#fff;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:24px;display:flex;flex-direction:column;gap:20px">
        <label style="display:block"><span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">문의 유형</span>
          <span style="position:relative;display:block"><select defaultValue="{{ catDefault }}" style="width:100%;height:56px;padding:0 44px 0 16px;border-radius:14px;border:1.5px solid {{ catBorder }};background:#F2F4F6;font-size:16px;color:#191F28;outline:none;appearance:none;font-family:inherit" style-focus="border-color:#3182F6;background:#fff"><option value="">유형을 선택해 주세요</option><option>스캔·인식</option><option>계정·로그인</option><option>결과·정품</option><option>제조사 도입</option><option>기타</option></select><svg style="position:absolute;right:16px;top:18px;pointer-events:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8B95A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
          <sc-if value="{{ errors }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:#F04452"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>문의 유형을 선택해 주세요.</span></sc-if>
        </label>
        <label style="display:block"><span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">제목</span><input type="text" defaultValue="{{ subjectDefault }}" placeholder="문의 내용을 한 줄로 요약해 주세요" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none;font-family:inherit" style-focus="border-color:#3182F6;background:#fff"></label>
        <label style="display:block"><span style="display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">내용<span style="font-weight:400;color:#8B95A1;font-family:Inter,sans-serif">{{ bodyLen }} / 1000</span></span>
          <textarea placeholder="발생한 상황, 기기·브라우저, 스캔한 제품명을 함께 적어 주시면 더 빠르게 도와드릴 수 있어요." style="width:100%;height:160px;padding:14px 16px;border-radius:14px;border:1.5px solid {{ bodyBorder }};background:#F2F4F6;font-size:16px;line-height:1.6;color:#191F28;outline:none;resize:none;font-family:inherit" style-focus="border-color:#3182F6;background:#fff"></textarea>
          <sc-if value="{{ errors }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:#F04452"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>내용을 10자 이상 입력해 주세요.</span></sc-if>
        </label>
        <div><span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">스크린샷 <span style="font-weight:400;color:#8B95A1">(선택)</span></span>
          <div style="display:flex;gap:10px">
            <button style="flex:none;width:88px;height:88px;border-radius:14px;border:1.5px dashed #B8C0CB;background:#F9FAFB;color:#8B95A1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:border-color .3s,background .3s;font-family:inherit" style-hover="border-color:#3182F6;background:#E8F3FF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg><span style="font-size:12px;font-weight:600;font-family:Inter,sans-serif">{{ fileCount }}/3</span></button>
            <sc-if value="{{ hasFile }}" hint-placeholder-val="{{ false }}"><div style="position:relative;width:88px;height:88px;border-radius:14px;background:linear-gradient(135deg,#EEF5FF,#DCEBFF);overflow:hidden"><button aria-label="삭제" style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:999px;border:0;background:#191F28;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></sc-if>
          </div>
          <div style="margin-top:8px;font-size:13px;color:#8B95A1">PNG · JPG, 최대 10MB</div>
        </div>
        <label style="display:block"><span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">답변 받을 이메일</span><input type="email" defaultValue="minji@puf.kr" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none;font-family:Inter,sans-serif" style-focus="border-color:#3182F6;background:#fff"><span style="display:block;margin-top:8px;font-size:13px;color:#8B95A1">로그인한 계정의 이메일이 자동으로 입력됐어요.</span></label>
      </div>
      <button style="height:56px;border:0;border-radius:16px;background:#3182F6;color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:background .3s;font-family:inherit" style-hover="background:#1B64DA">문의 보내기</button>
    </div>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:24px">
      <div style="background:#fff;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,0.06);padding:40px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px">
        <span style="width:72px;height:72px;border-radius:999px;background:#E6F8EF;color:#14B866;display:flex;align-items:center;justify-content:center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
        <div><h1 style="margin:0;font-size:{{ h1Size }};font-weight:700;letter-spacing:-0.03em;line-height:1.3">문의가 접수됐어요</h1><p style="margin:8px 0 0;font-size:15px;line-height:1.6;color:#6B7684">답변은 <strong style="color:#191F28;font-weight:600;font-family:Inter,sans-serif">minji@puf.kr</strong>로 보내드려요.</p></div>
        <div style="width:100%;border-radius:16px;background:#F2F4F6;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left">
          <div><div style="font-size:13px;color:#8B95A1">접수 번호</div><div style="margin-top:4px;font-size:16px;font-weight:700;font-family:Inter,sans-serif">#PUF-260907-0142</div></div>
          <div><div style="font-size:13px;color:#8B95A1">예상 답변 시간</div><div style="margin-top:4px;font-size:16px;font-weight:700">영업일 기준 1일 이내</div></div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a href="#" style="height:56px;border-radius:16px;background:#3182F6;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .3s" style-hover="background:#1B64DA">문의 내역 보기</a>
        <a href="#" style="height:56px;border-radius:16px;background:#E8F3FF;color:#3182F6;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:background .3s" style-hover="background:#D4E8FF">고객센터로 돌아가기</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:900},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;form&quot;,&quot;options&quot;:[&quot;form&quot;,&quot;error&quot;,&quot;done&quot;],&quot;tsType&quot;:&quot;'form'|'error'|'done'&quot;},&quot;desktop&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'form', d = !!this.props.desktop, err = s === 'error';
    return { isForm: s !== 'done', isDone: s === 'done', errors: err, h1Size: d ? '32px' : '28px', catBorder: err ? '#F04452' : 'transparent', bodyBorder: err ? '#F04452' : 'transparent', catDefault: err ? '' : '결과·정품', subjectDefault: err ? '위조 의심 결과 문의' : '', bodyLen: 0, fileCount: err ? 1 : 0, hasFile: err };
  }
}
</script>
</body>
</html>
