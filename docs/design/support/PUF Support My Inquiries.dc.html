<!DOCTYPE html>
<html>
<head>

<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E5E8EB;font-family:Pretendard,Inter,'Noto Sans KR',sans-serif;color:#191F28;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
*{box-sizing:border-box}
a{color:#3182F6;text-decoration:none}a:hover{color:#1B64DA}
button,input{font-family:inherit}
input::placeholder{color:#B0B8C1}
</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:80px;padding:80px;align-items:flex-start">

        <div style="height:56px;padding:0 8px;display:flex;align-items:center"><button aria-label="뒤로" style="width:44px;height:44px;border:0;background:none;color:#191F28;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button></div>
        <div style="flex:1;padding:8px 20px 32px"><dc-import name="PUF Inquiry List" state="list" hint-size="100%,600px"></dc-import></div>
        <dc-import name="PUF Tab Bar" active="me" hint-size="100%,84px"></dc-import>
      </div>
    </div>
    <div style="width:375px">
      <div style="font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#6B7684;margin-bottom:16px">MY INQUIRIES · MOBILE · EMPTY</div>

        <div style="height:56px;padding:0 8px;display:flex;align-items:center"><button aria-label="뒤로" style="width:44px;height:44px;border:0;background:none;color:#191F28;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button></div>
        <div style="flex:1;padding:8px 20px 32px"><dc-import name="PUF Inquiry List" state="empty" hint-size="100%,600px"></dc-import></div>
        <dc-import name="PUF Tab Bar" active="me" hint-size="100%,84px"></dc-import>
      </div>
    </div>
    <div style="width:375px">
      <div style="font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#6B7684;margin-bottom:16px">MY INQUIRIES · MOBILE · DETAIL</div>
      <div data-screen-label="문의 상세" style="width:375px;background:#F2F4F6;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06)">
        <div style="height:56px;padding:0 8px;display:flex;align-items:center;justify-content:space-between"><button aria-label="뒤로" style="width:44px;height:44px;border:0;background:none;color:#191F28;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button><span style="font-size:16px;font-weight:600">문의 상세</span><span style="width:44px"></span></div>
        <div style="padding:8px 20px 32px"><dc-import name="PUF Inquiry List" state="detail" hint-size="100%,800px"></dc-import></div>
      </div>
    </div>
  </div>
  <div style="width:1440px">

      <dc-import name="PUF Top Bar" active="support" hint-size="100%,72px"></dc-import>
      <div style="padding:48px 80px 96px;display:grid;grid-template-columns:200px 400px 1fr;gap:40px;align-items:start">
        <div style="display:flex;flex-direction:column;gap:4px;position:sticky;top:24px">
          <a href="#" style="padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#4E5968;transition:background .3s" style-hover="background:#E5E8EB">내 프로필</a>

          <a href="#" style="padding:12px 16px;border-radius:12px;font-size:15px;font-weight:700;color:#3182F6;background:#E8F3FF">문의 내역</a>
          <a href="#" style="padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#4E5968;transition:background .3s" style-hover="background:#E5E8EB">고객센터</a>
        </div>
        <dc-import name="PUF Inquiry List" state="list" desktop="{{ true }}" hint-size="100%,600px"></dc-import>
        <dc-import name="PUF Inquiry List" state="detail" desktop="{{ true }}" hint-size="100%,800px"></dc-import>
      </div>
    </div>
  </div>
</div>
</x-dc>

</html>
