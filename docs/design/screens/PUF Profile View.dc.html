<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:16px;font-family:Pretendard,Inter,'Noto Sans KR',sans-serif;color:#191F28">
  <div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;gap:16px;align-items:center">
    <div style="flex:none;width:64px;height:64px;border-radius:999px;background:#E8F3FF;color:#3182F6;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center">민</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:20px;font-weight:700;letter-spacing:-0.02em">김민지</div>
      <div style="margin-top:2px;font-size:14px;color:#6B7684;font-family:Inter,sans-serif">minji@puf.kr</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
        <span style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;font-weight:600;color:#4E5968;background:#F2F4F6;padding:5px 10px;border-radius:999px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 8l9 6 9-6"></path></svg>이메일</span>
        <span style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;font-weight:600;color:#4E5968;background:#F2F4F6;padding:5px 10px;border-radius:999px"><span style="width:10px;height:10px;border-radius:999px;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0)"></span>Google</span>
        <span style="display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;font-weight:600;color:#4E5968;background:#F2F4F6;padding:5px 10px;border-radius:999px"><span style="width:10px;height:10px;border-radius:999px;background:#FEE500"></span>카카오</span>
      </div>
    </div>
  </div>

  <div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06)">
    <div style="font-size:16px;font-weight:700">기본 정보</div>
    <label style="display:block;margin-top:16px">
      <span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">이름</span>
      <input type="text" defaultValue="김민지" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none;font-family:inherit" style-focus="border-color:#3182F6;background:#fff">
    </label>
    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button style="height:44px;padding:0 20px;border:0;border-radius:14px;background:#E8F3FF;color:#3182F6;font-size:15px;font-weight:700;cursor:pointer;transition:background .3s;font-family:inherit" style-hover="background:#D4E8FF">저장</button></div>
  </div>

  <div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06)">
    <div style="font-size:16px;font-weight:700">비밀번호 변경</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px">
      <input type="password" placeholder="현재 비밀번호" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none;font-family:inherit" style-focus="border-color:#3182F6;background:#fff">
      <input type="password" placeholder="새 비밀번호 (영문·숫자 포함 8자 이상)" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none;font-family:inherit" style-focus="border-color:#3182F6;background:#fff">
      <input type="password" placeholder="새 비밀번호 확인" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none;font-family:inherit" style-focus="border-color:#3182F6;background:#fff">
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button style="height:44px;padding:0 20px;border:0;border-radius:14px;background:#E8F3FF;color:#3182F6;font-size:15px;font-weight:700;cursor:pointer;transition:background .3s;font-family:inherit" style-hover="background:#D4E8FF">변경</button></div>
  </div>

  <div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:space-between;gap:16px">
    <div><div style="font-size:16px;font-weight:700">마케팅 정보 수신</div><div style="margin-top:4px;font-size:14px;line-height:1.5;color:#6B7684">정품 확인 소식과 혜택을 이메일로 받아요.</div></div>
    <button onClick="{{ toggleMk }}" aria-label="마케팅 수신 토글" style="flex:none;width:52px;height:32px;border-radius:999px;border:0;padding:3px;background:{{ mkBg }};cursor:pointer;transition:background .3s;display:flex;align-items:center"><span style="width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.15);display:block;transition:transform .3s;transform:{{ mkX }}"></span></button>
  </div>

  <div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:space-between;gap:16px">
    <div><div style="font-size:16px;font-weight:700">계정 삭제</div><div style="margin-top:4px;font-size:14px;line-height:1.5;color:#6B7684">스캔 기록과 계정 정보가 모두 삭제되며 복구할 수 없어요.</div></div>
    <button style="flex:none;height:44px;padding:0 16px;border:0;border-radius:14px;background:none;color:#F04452;font-size:15px;font-weight:700;cursor:pointer;transition:background .3s;font-family:inherit" style-hover="background:#FEECEE">계정 삭제</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { mk: true };
  renderVals() {
    return { mkBg: this.state.mk ? '#3182F6' : '#B8C0CB', mkX: this.state.mk ? 'translateX(20px)' : 'translateX(0)', toggleMk: () => this.setState(s => ({ mk: !s.mk })) };
  }
}
</script>
</body>
</html>
