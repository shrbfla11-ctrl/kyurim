<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E5E8EB;font-family:Pretendard,Inter,'Noto Sans KR',sans-serif;color:#191F28;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
*{box-sizing:border-box}
a{color:#3182F6;text-decoration:none}a:hover{color:#1B64DA}
button{font-family:inherit}
</style>
</helmet>
<div style="display:flex;gap:48px;padding:80px;align-items:flex-start">
  <div style="width:375px">
    <div style="font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#6B7684;margin-bottom:16px">PROFILE · MOBILE</div>
    <div data-screen-label="프로필 모바일" style="width:375px;background:#F2F4F6;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;flex-direction:column">
      <div style="padding:16px 20px 8px"><h1 style="margin:0;font-size:28px;font-weight:700;letter-spacing:-0.03em">MY</h1></div>
      <div style="padding:8px 16px 24px"><dc-import name="PUF Profile View" hint-size="100%,900px"></dc-import></div>
      <dc-import name="PUF Tab Bar" active="me" hint-size="100%,84px"></dc-import>
    </div>
  </div>
  <div style="width:1440px">
    <div style="font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.08em;color:#6B7684;margin-bottom:16px">PROFILE · DESKTOP 1440</div>
    <div data-screen-label="프로필 데스크톱" style="width:1440px;min-height:900px;background:#F2F4F6;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06)">
      <dc-import name="PUF Top Bar" active="none" menu-open="{{ true }}" hint-size="100%,72px"></dc-import>
      <div style="padding:48px 80px 80px;display:grid;grid-template-columns:240px 1fr;gap:48px;max-width:1040px">
        <div style="display:flex;flex-direction:column;gap:4px;position:sticky;top:24px;align-self:start">
          <a href="#" style="padding:12px 16px;border-radius:12px;font-size:15px;font-weight:700;color:#3182F6;background:#E8F3FF">내 프로필</a>
          <a href="#" style="padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#4E5968;transition:background .3s" style-hover="background:#E5E8EB">스캔 기록</a>
          <a href="#" style="padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#4E5968;transition:background .3s" style-hover="background:#E5E8EB">알림 설정</a>
          <a href="#" style="padding:12px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#4E5968;transition:background .3s" style-hover="background:#E5E8EB">고객센터</a>
        </div>
        <div>
          <h1 style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:-0.03em">내 프로필</h1>
          <dc-import name="PUF Profile View" hint-size="100%,900px"></dc-import>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
