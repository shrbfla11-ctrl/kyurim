<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes pufScan{0%{top:0}50%{top:calc(100% - 2px)}100%{top:0}}
@keyframes pufPulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes pufToast{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</helmet>
<div style="position:relative;width:100%;height:100%;background:radial-gradient(80% 60% at 50% 40%,#3A4350 0%,#232A33 60%,#191F28 100%);color:#fff;font-family:Pretendard,Inter,'Noto Sans KR',sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <!-- top -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;position:relative;z-index:2">
    <button aria-label="닫기" style="width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,0.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s" style-hover="background:rgba(255,255,255,0.22)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <span style="font-size:15px;font-weight:600">정품 확인</span>
    <button aria-label="도움말" style="width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,0.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s" style-hover="background:rgba(255,255,255,0.22)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 3.5M12 17h.01"></path></svg></button>
  </div>
  <!-- toast -->
  <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:16px;right:16px;top:76px;z-index:3;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#fff;color:#191F28;box-shadow:0 8px 24px rgba(0,0,0,0.25);animation:pufToast .3s ease-out">
      <span style="flex:none;width:36px;height:36px;border-radius:999px;background:#FEECEE;color:#F04452;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg></span>
      <span style="flex:1"><span style="display:block;font-size:15px;font-weight:700">초점이 맞지 않아요</span><span style="display:block;font-size:13px;color:#6B7684;margin-top:2px">밝은 곳에서 스티커에 가까이 대고 다시 촬영해 주세요.</span></span>
    </div>
  </sc-if>
  <!-- center -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px">
    <div style="font-size:16px;font-weight:600;color:rgba(255,255,255,0.9);display:flex;align-items:center;gap:8px">
      <sc-if value="{{ isScanning }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:999px;background:#3182F6;animation:pufPulse 1s ease-in-out infinite;display:block"></span></sc-if>
      {{ guideText }}
    </div>
    <div style="position:relative;width:{{ frameSize }};aspect-ratio:1">
      <div style="position:absolute;top:0;left:0;width:36px;height:36px;border-top:3px solid {{ frameColor }};border-left:3px solid {{ frameColor }};border-radius:12px 0 0 0;transition:border-color .3s"></div>
      <div style="position:absolute;top:0;right:0;width:36px;height:36px;border-top:3px solid {{ frameColor }};border-right:3px solid {{ frameColor }};border-radius:0 12px 0 0;transition:border-color .3s"></div>
      <div style="position:absolute;bottom:0;left:0;width:36px;height:36px;border-bottom:3px solid {{ frameColor }};border-left:3px solid {{ frameColor }};border-radius:0 0 0 12px;transition:border-color .3s"></div>
      <div style="position:absolute;bottom:0;right:0;width:36px;height:36px;border-bottom:3px solid {{ frameColor }};border-right:3px solid {{ frameColor }};border-radius:0 0 12px 0;transition:border-color .3s"></div>
      <!-- sticker -->
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);width:56%;height:56%;border-radius:16px;background:linear-gradient(135deg,#F7F9FB,#DDE3EA);box-shadow:0 12px 32px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;overflow:hidden;filter:blur({{ blur }})">
        <div style="position:absolute;inset:10px;border-radius:10px;background:repeating-radial-gradient(circle at 30% 40%,#8B95A1 0 1px,transparent 1px 6px),repeating-radial-gradient(circle at 70% 60%,#B8C0CB 0 1px,transparent 1px 5px),repeating-linear-gradient(45deg,rgba(107,118,132,0.25) 0 1px,transparent 1px 7px);opacity:.9"></div>
        <span style="position:relative;font-family:Inter,sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;color:#4E5968;background:rgba(255,255,255,0.85);padding:4px 8px;border-radius:6px">PUF</span>
      </div>
      <sc-if value="{{ isScanning }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;left:8px;right:8px;height:2px;background:linear-gradient(90deg,rgba(49,130,246,0),#3182F6,rgba(49,130,246,0));box-shadow:0 0 16px 3px rgba(49,130,246,0.6);animation:pufScan 2s ease-in-out infinite"></div>
      </sc-if>
    </div>
    <div style="height:24px;font-size:14px;color:rgba(255,255,255,0.7)">{{ subText }}</div>
  </div>
  <!-- bottom -->
  <div style="padding:0 32px 24px;display:flex;flex-direction:column;align-items:center;gap:20px">
    <div style="width:100%;display:flex;align-items:center;justify-content:space-between">
      <button aria-label="플래시" style="width:56px;height:56px;border-radius:999px;border:0;background:rgba(255,255,255,0.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s" style-hover="background:rgba(255,255,255,0.22)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></button>
      <button aria-label="촬영" style="width:80px;height:80px;border-radius:999px;border:4px solid #fff;background:transparent;padding:4px;cursor:pointer;display:flex"><span style="flex:1;border-radius:999px;background:{{ shutterBg }};transition:background .3s;display:flex;align-items:center;justify-content:center">
        <sc-if value="{{ isScanning }}" hint-placeholder-val="{{ false }}"><span style="width:22px;height:22px;border-radius:999px;border:3px solid rgba(255,255,255,0.35);border-top-color:#fff;animation:pufSpin .8s linear infinite;display:block"></span></sc-if>
      </span></button>
      <button aria-label="갤러리" style="width:56px;height:56px;border-radius:999px;border:0;background:rgba(255,255,255,0.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .3s" style-hover="background:rgba(255,255,255,0.22)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M21 16l-5-5-9 8"></path></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.55)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>촬영한 이미지는 저장되지 않아요</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:375,&quot;height&quot;:812},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;idle&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;scanning&quot;,&quot;error&quot;],&quot;tsType&quot;:&quot;'idle'|'scanning'|'error'&quot;},&quot;frameSize&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;240px&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'idle';
    return {
      isScanning: s === 'scanning', isError: s === 'error',
      guideText: s === 'scanning' ? '패턴을 대조하고 있어요…' : '스티커를 사각형 안에 맞춰 주세요',
      subText: s === 'scanning' ? '움직이지 말고 잠시만 기다려 주세요' : s === 'error' ? '초점과 조명을 확인해 주세요' : '',
      frameColor: s === 'error' ? '#F04452' : '#3182F6',
      frameSize: this.props.frameSize ?? '240px',
      blur: s === 'error' ? '2px' : '0px',
      shutterBg: s === 'scanning' ? '#3182F6' : '#fff'
    };
  }
}
</script>
</body>
</html>
