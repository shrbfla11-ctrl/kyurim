<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
body{margin:0;font-family:Pretendard,Inter,'Noto Sans KR',sans-serif;color:#191F28;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
*{box-sizing:border-box}
a{color:#3182F6;text-decoration:none}a:hover{color:#1B64DA}
button,input{font-family:inherit}
input::placeholder{color:#B0B8C1}
@keyframes kSpin{to{transform:rotate(360deg)}}
</style>
</helmet>
<div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:32px">

<!-- LOGIN -->
<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
  <div>
    <h1 style="margin:0;font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-0.03em">다시 만나서 반가워요</h1>
    <p style="margin:8px 0 0;font-size:15px;line-height:1.5;color:#6B7684">이메일로 로그인하거나 간편 로그인을 이용하세요.</p>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px">
    <label style="display:block">
      <span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">이메일</span>
      <input type="email" defaultValue="minji@puf.kr" placeholder="example@puf.kr" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none" style-focus="border-color:#3182F6;background:#fff">
    </label>
    <label style="display:block">
      <span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">비밀번호</span>
      <span style="position:relative;display:block">
        <input type="{{ pwType }}" defaultValue="puf12345!" placeholder="비밀번호 입력" style="width:100%;height:56px;padding:0 52px 0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none" style-focus="border-color:#3182F6;background:#fff">
        <button type="button" onClick="{{ togglePw }}" aria-label="비밀번호 보기" style="position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#8B95A1;cursor:pointer">
          <sc-if value="{{ showPw }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.1A10 10 0 0121 12a10.5 10.5 0 01-2.6 3.4M6.2 6.2A10.5 10.5 0 003 12s3.5 6 9 6a9.6 9.6 0 003.8-.8"></path></svg></sc-if>
          <sc-if value="{{ hidePw }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
        </button>
      </span>
    </label>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:#4E5968;cursor:pointer"><input type="checkbox" defaultChecked="{{ true }}" style="width:20px;height:20px;accent-color:#3182F6;margin:0">자동 로그인</label>
      <a href="#" style="font-size:14px;font-weight:600;color:#6B7684">비밀번호 찾기</a>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:24px">
    <button style="height:56px;border:0;border-radius:16px;background:#3182F6;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;opacity:{{ btnOpacity }}">
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:999px;border:2.5px solid rgba(255,255,255,0.35);border-top-color:#fff;animation:kSpin 0.8s linear infinite;display:block"></span></sc-if>
      {{ loginLabel }}
    </button>
    <div style="display:flex;align-items:center;gap:16px;color:#B0B8C1;font-size:13px"><span style="flex:1;height:1px;background:#E5E8EB"></span>또는<span style="flex:1;height:1px;background:#E5E8EB"></span></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button style="height:56px;border:0;border-radius:16px;background:#FEE500;color:#191F28;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="#191F28"><path d="M12 3C6.5 3 2 6.5 2 10.8c0 2.8 1.9 5.2 4.7 6.6l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.4 0 .9.1 1.3.1 5.5 0 10-3.5 10-7.9S17.5 3 12 3z"></path></svg>카카오로 계속하기</button>
      <button style="height:56px;border:1.5px solid #E5E8EB;border-radius:16px;background:#fff;color:#191F28;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.5 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"></path><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 019.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 000 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"></path><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.5-5.9l-7.6-5.9c-2.1 1.4-4.8 2.3-7.9 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"></path></svg>Google로 계속하기</button>
    </div>
    <p style="margin:0;text-align:center;font-size:14px;color:#6B7684">아직 계정이 없으신가요? <a href="#" style="font-weight:700">회원가입</a></p>
  </div>
</sc-if>

<!-- SIGNUP -->
<sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
  <div>
    <h1 style="margin:0;font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-0.03em">PUF 시작하기</h1>
    <p style="margin:8px 0 0;font-size:15px;line-height:1.5;color:#6B7684">1분이면 가입할 수 있어요.</p>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px">
    <label style="display:block">
      <span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">이름</span>
      <input type="text" defaultValue="김민지" placeholder="이름 입력" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none" style-focus="border-color:#3182F6;background:#fff">
    </label>
    <label style="display:block">
      <span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">이메일</span>
      <input type="email" defaultValue="minji@puf.kr" placeholder="example@puf.kr" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid {{ emailBorder }};background:#F2F4F6;font-size:16px;color:#191F28;outline:none" style-focus="border-color:#3182F6;background:#fff">
      <sc-if value="{{ errors }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:#F04452"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>이미 가입된 이메일이에요. 로그인해 주세요.</span></sc-if>
    </label>
    <label style="display:block">
      <span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">비밀번호</span>
      <span style="position:relative;display:block">
        <input type="{{ pwType }}" defaultValue="puf12345!" placeholder="영문·숫자 포함 8자 이상" style="width:100%;height:56px;padding:0 52px 0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none" style-focus="border-color:#3182F6;background:#fff">
        <button type="button" onClick="{{ togglePw }}" aria-label="비밀번호 보기" style="position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#8B95A1;cursor:pointer">
          <sc-if value="{{ showPw }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.1A10 10 0 0121 12a10.5 10.5 0 01-2.6 3.4M6.2 6.2A10.5 10.5 0 003 12s3.5 6 9 6a9.6 9.6 0 003.8-.8"></path></svg></sc-if>
          <sc-if value="{{ hidePw }}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
        </button>
      </span>
      <span style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:#14B866"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>사용할 수 있는 비밀번호예요</span>
    </label>
    <label style="display:block">
      <span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">비밀번호 확인</span>
      <input type="{{ pwType }}" defaultValue="puf1234" placeholder="비밀번호 다시 입력" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid {{ pw2Border }};background:#F2F4F6;font-size:16px;color:#191F28;outline:none" style-focus="border-color:#3182F6;background:#fff">
      <sc-if value="{{ errors }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:#F04452"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>비밀번호가 일치하지 않아요.</span></sc-if>
    </label>
  </div>
  <div style="background:#F2F4F6;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px">
    <label style="display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:#191F28;padding-bottom:12px;border-bottom:1px solid #E5E8EB;cursor:pointer"><input type="checkbox" defaultChecked="{{ true }}" style="width:20px;height:20px;accent-color:#3182F6;margin:0">전체 동의</label>
    <label style="display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#4E5968;cursor:pointer"><span style="display:flex;align-items:center;gap:10px"><input type="checkbox" defaultChecked="{{ true }}" style="width:20px;height:20px;accent-color:#3182F6;margin:0"><span style="color:#3182F6;font-weight:600">[필수]</span> 이용약관 동의</span><a href="#" style="font-size:13px;color:#8B95A1">보기</a></label>
    <label style="display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#4E5968;cursor:pointer"><span style="display:flex;align-items:center;gap:10px"><input type="checkbox" defaultChecked="{{ true }}" style="width:20px;height:20px;accent-color:#3182F6;margin:0"><span style="color:#3182F6;font-weight:600">[필수]</span> 개인정보처리방침 동의</span><a href="#" style="font-size:13px;color:#8B95A1">보기</a></label>
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#4E5968;cursor:pointer"><input type="checkbox" style="width:20px;height:20px;accent-color:#3182F6;margin:0"><span style="color:#8B95A1;font-weight:600">[선택]</span> 복약 알림·소식 수신 동의</label>
  </div>
  <div style="display:flex;flex-direction:column;gap:24px">
    <button style="height:56px;border:0;border-radius:16px;background:#3182F6;color:#fff;font-size:17px;font-weight:700;cursor:pointer">가입하기</button>
    <p style="margin:0;text-align:center;font-size:14px;color:#6B7684">이미 계정이 있으신가요? <a href="#" style="font-weight:700">로그인</a></p>
  </div>
</sc-if>

<!-- RESET -->
<sc-if value="{{ isReset }}" hint-placeholder-val="{{ false }}">
  <div>
    <h1 style="margin:0;font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-0.03em">비밀번호를 잊으셨나요?</h1>
    <p style="margin:8px 0 0;font-size:15px;line-height:1.5;color:#6B7684">가입한 이메일을 입력하시면 비밀번호 재설정 링크를 보내드려요.</p>
  </div>
  <label style="display:block">
    <span style="display:block;font-size:14px;font-weight:600;color:#4E5968;margin-bottom:8px">이메일</span>
    <input type="email" placeholder="example@puf.kr" style="width:100%;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid transparent;background:#F2F4F6;font-size:16px;color:#191F28;outline:none" style-focus="border-color:#3182F6;background:#fff">
  </label>
  <div style="display:flex;flex-direction:column;gap:24px">
    <button style="height:56px;border:0;border-radius:16px;background:#3182F6;color:#fff;font-size:17px;font-weight:700;cursor:pointer">재설정 링크 보내기</button>
    <a href="#" style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:#6B7684"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>로그인으로 돌아가기</a>
  </div>
</sc-if>

<!-- SENT -->
<sc-if value="{{ isSent }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px;padding-top:16px">
    <div style="width:72px;height:72px;border-radius:999px;background:#E6F8EF;display:flex;align-items:center;justify-content:center;color:#14B866"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
    <div>
      <h1 style="margin:0;font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-0.03em">메일을 보냈어요</h1>
      <p style="margin:12px 0 0;font-size:15px;line-height:1.5;color:#6B7684"><strong style="color:#191F28;font-weight:600">minji@puf.kr</strong>로 재설정 링크를 보냈어요.<br>10분 안에 메일의 링크를 눌러 새 비밀번호를 설정해 주세요.</p>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:24px">
    <button style="height:56px;border:0;border-radius:16px;background:#3182F6;color:#fff;font-size:17px;font-weight:700;cursor:pointer">로그인으로 돌아가기</button>
    <p style="margin:0;text-align:center;font-size:14px;color:#6B7684">메일이 오지 않았나요? <a href="#" style="font-weight:700">다시 보내기</a></p>
  </div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:720},&quot;screen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;login&quot;,&quot;options&quot;:[&quot;login&quot;,&quot;signup&quot;,&quot;reset&quot;,&quot;sent&quot;],&quot;tsType&quot;:&quot;'login'|'signup'|'reset'|'sent'&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;errors&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { showPw: false };
  renderVals() {
    const s = this.props.screen ?? 'login';
    const loading = !!this.props.loading, errors = !!this.props.errors;
    return {
      isLogin: s === 'login', isSignup: s === 'signup', isReset: s === 'reset', isSent: s === 'sent',
      loading, errors,
      loginLabel: loading ? '로그인 중...' : '로그인',
      btnOpacity: loading ? 0.85 : 1,
      emailBorder: errors ? '#F04452' : 'transparent',
      pw2Border: errors ? '#F04452' : 'transparent',
      showPw: this.state.showPw, hidePw: !this.state.showPw,
      pwType: this.state.showPw ? 'text' : 'password',
      togglePw: () => this.setState(st => ({ showPw: !st.showPw }))
    };
  }
}
</script>
</body>
</html>
